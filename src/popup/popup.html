<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Peel</title><link rel="stylesheet" href="../ui/tiles.css"><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="glow"></div>
  <header>
    <img class="logo" src="../../icons/peel128.png" alt="">
    <h1>peel</h1>
    <span id="site" class="site"></span>
    <button id="gear" class="icon" title="Settings">⚙</button>
  </header>
  <main id="main"><p class="muted">Looking at this tab…</p></main>
  <section id="settings" class="settings" hidden>
    <label class="tog"><input type="checkbox" id="fab"><i></i><span>Show the corner on pages</span></label>
    <label class="tog"><input type="checkbox" id="motion"><i></i><span>Motion effects (bugs, comets, scroll-ins)</span></label>
    <label class="tog"><input type="checkbox" id="sound"><i></i><span>Sounds (paper rips, rain, modem…)</span></label>
    <label class="tog"><input type="checkbox" id="quips"><i></i><span>The corner talks now and then</span></label>
    <label class="tog"><input type="checkbox" id="patina"><i></i><span>Patina: sites age as you visit them</span></label>
      </section>
  <script src="../ui/swatches.js"></script><script src="popup.js"></script>
</body>
</html>
